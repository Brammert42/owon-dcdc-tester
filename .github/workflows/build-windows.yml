name: Build Windows application

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      MPLCONFIGDIR: ${{ runner.temp }}\owon-matplotlib
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install application and build dependencies
        run: python -m pip install --upgrade pip; python -m pip install -r requirements-tested.txt -r requirements-build.txt

      - name: Run test suite
        run: python -B -m unittest discover -s tests -q

      - name: Build and smoke-test Windows bundle
        shell: powershell
        run: ./scripts/build_windows.ps1

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: OWON-Tester-Windows
          path: dist/OWON-Tester-Windows.zip
          if-no-files-found: error
